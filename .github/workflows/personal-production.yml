# Retired: production no longer composes or builds on its own.
#
# The staging nightly builds every artifact once, the soak hardware verifies
# that exact build, and personal-promote.yml promotes the same commit and
# bytes to production-YYYYMMDD / production-latest (spec
# docs/superpowers/specs/2026-10-09-ring-soak-promote-design.md). This stub
# keeps the workflow name visible in the Actions UI and fails any dispatch
# with a pointer, so nobody mistakes it for a way to ship production.
name: Personal Production Nightly (retired)

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point at the promote workflow
        run: |
          echo "::error::production is promoted by personal-promote.yml (see the spec)"
          exit 1
