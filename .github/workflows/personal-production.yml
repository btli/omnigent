# Nightly personal production ring for the btli fork.
#
# Composes fork branch `production` = upstream main + every open NON-draft
# btli PR (no extras, no dev tag — draft status is the promotion gate) and
# pins an immutable production-YYYYMMDD branch + tag, the pin homelab's
# build-omnigent-production.yml resolves at 11:10 UTC. After the pin it
# builds a debug APK and an unsigned macOS desktop app from the pinned
# commit and publishes both on the dated prerelease plus a floating
# `production-latest` release (stable download URLs for device testing).
# No image dispatch (that stays on the staging nightly).
#
# Migration gate (schema safety, spec decision 11): stage.py itself refuses
# the atomic push when the candidate touches omnigent/db/migrations/versions/
# — versus upstream main OR the previous production pin — unless this run was
# dispatched with approve_migration=<that exact candidate sha>. A blocked run
# is a SUCCESS outcome (green): it alerts via ha-notify and waits for the
# operator to re-dispatch after the CNPG backup checkpoint (homelab runbook).
#
# Trust boundary: same shape as personal-staging.yml — the test gate runs
# third-party dev deps secretless; the compose job is privileged (pushes
# refs) but runs only the stdlib composer. The android/desktop build jobs
# execute merged-PR code secretless; android-sign is a clean-room re-sign
# that never checks out merged code. ha-notify POSTs are HMAC-signed
# and always best-effort: CI never holds an HA API token (the in-cluster
# receiver does), and an unreachable receiver only warns.
name: Personal Production Nightly

on:
  schedule:
    # After the staging nightly's 10:00 UTC slot, before homelab's 11:10 UTC
    # poll of the production-YYYYMMDD pin. Off :00 like the other rings.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      approve_migration:
        description: >-
          Full 40-hex candidate sha: publishes a migration-touching
          composition after the CNPG backup checkpoint (see the homelab
          runbook). Leave empty for a normal run.
        type: string
        default: ""

permissions:
  contents: read

# Own group: the production compose must never cancel (or be cancelled by)
# the staging nightly/hourly runs — different groups already guarantee that.
# cancel-in-progress stays false so an operator approve_migration dispatch
# queues behind a running compose instead of killing it mid-push.
concurrency:
  group: personal-production
  cancel-in-progress: false

jobs:
  # Secretless test gate — same contract as personal-staging.yml: `uv run`
  # installs third-party dev deps, so this job never holds a write token
  # (the repo's default pytest testpaths never collect .github/scripts/**,
  # hence the explicit run here).
  test-composer:
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Test the staging composer
        run: uv run --frozen --group dev python -m pytest .github/scripts/personal-staging/

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — test-composer job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  compose:
    needs: test-composer
    # Accident prevention for non-main dispatches (schedule always runs main);
    # a dispatched ref executes its own workflow copy, so this is not a
    # security boundary — see personal-staging.yml's integrate job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      date: ${{ steps.report.outputs.date }}
      production_sha: ${{ steps.report.outputs.production_sha }}
      # Empty when the migration gate blocked the pin — downstream build
      # and publish jobs key off this to skip.
      tag: ${{ steps.report.outputs.tag }}
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # App tokens cannot push workflow-file changes; prefer the
          # workflows-scoped PAT, with GitHub token as fallback.
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Compose production from upstream main + open non-draft btli PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on schedule runs; the gate compares it to the candidate sha.
          APPROVE_MIGRATION: ${{ inputs.approve_migration }}
        run: |
          set -euo pipefail
          # Preflight identity for git merge --no-ff --no-commit; stage.py's
          # COMMIT_IDENT -c overrides set the reproducible composition
          # identities (same rationale as personal-staging.yml).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          python3 .github/scripts/personal-staging/stage.py stage --ring production \
            --migration-approval "$APPROVE_MIGRATION" \
            --upstream-remote upstream --fork-remote origin \
            --report merge-report.json

      - name: Export report fields
        id: report
        run: |
          set -euo pipefail
          {
            echo "date=$(jq -r '.date // ""' merge-report.json)"
            echo "production_sha=$(jq -r '.staging_sha // ""' merge-report.json)"
            echo "tag=$(jq -r '.tag // ""' merge-report.json)"
          } >> "$GITHUB_OUTPUT"

      # Blocked is a SUCCESS outcome: the composer already refused the push
      # and wrote the BLOCKED step summary; this step only raises the alert.
      - name: Alert when the migration gate blocked the pin
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          blocked=$(jq -r '.migration_gate.blocked // false' merge-report.json)
          if [ "$blocked" != "true" ]; then
            exit 0
          fi
          candidate=$(jq -r '.migration_gate.candidate' merge-report.json)
          echo "::notice::migration gate blocked candidate $candidate — no refs pushed; blocked is a success outcome"
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          msg="omnigent production migration gate BLOCKED candidate $candidate (touches omnigent/db/migrations/versions/). Pin NOT published. After a verified-completed CNPG Backup, re-dispatch personal-production.yml with approve_migration=$candidate (homelab runbook). $RUN_URL"
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"

      - name: Upload merge report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-report
          path: merge-report.json

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — compose job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Secretless: this job executes third-party gradle/build code from the
  # merged PRs, so it gets no secrets, no persisted git credentials, and
  # read-only access to the shared gradle cache (a poisoned cache write
  # would be restored by future runs).
  android-build:
    needs: compose
    if: needs.compose.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/android
    steps:
      - name: Checkout the production commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.compose.outputs.production_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache read-only)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: true

      # Datestamp as versionCode keeps nightly installs monotonically
      # upgradeable on-device (fits comfortably under Android's 2.1e9 cap).
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ needs.compose.outputs.date }}
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain \
            -PversionCode="$VERSION_CODE"

      # Hand off exactly one named file from a freshly created dir — the
      # build must not be able to smuggle extra files across the boundary.
      - name: Stage build outputs
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/unsigned"
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/unsigned/omnigent-production-debug.apk"

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned/omnigent-production-debug.apk

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — android-build job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Clean job for the keystore: only downloads the built artifact, never
  # checks out or executes merged code. The APK is ALWAYS re-signed here —
  # with the shared keystore when configured, else with a keystore minted in
  # this job — so the untrusted build's own signature never survives.
  android-sign:
    needs: android-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Server-enforced gate for the keystore secrets: the staging-signing
    # Environment carries the OMNIGENT_DEBUG_* secrets and a main-only
    # deployment-branch rule, so a dispatched non-main workflow copy can
    # never read them regardless of what its file says.
    environment: staging-signing
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download unsigned build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-unsigned
          path: unsigned

      - name: Verify artifact contents
        run: |
          set -euo pipefail
          got="$(find unsigned -mindepth 1 | LC_ALL=C sort | paste -sd' ' -)"
          want="unsigned/omnigent-production-debug.apk"
          if [ "$got" != "$want" ]; then
            echo "unexpected artifact contents: $got"
            exit 1
          fi

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNIGENT_DEBUG_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.OMNIGENT_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            printf '%s' "$KS_PASS" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$KEY_PASS" > "$RUNNER_TEMP/key-pass"
            printf '%s' "$KEY_ALIAS" > "$RUNNER_TEMP/key-alias"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # No shared keystore: mint a run-ephemeral one (in-place upgrades
            # across nightlies won't work, flagged in the release notes).
            pass="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
            printf '%s' "$pass" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$pass" > "$RUNNER_TEMP/key-pass"
            printf '%s' "omnigent-ephemeral" > "$RUNNER_TEMP/key-alias"
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
              -alias omnigent-ephemeral -keyalg RSA -keysize 2048 -validity 30 \
              -storepass:file "$RUNNER_TEMP/ks-pass" \
              -keypass:file "$RUNNER_TEMP/key-pass" \
              -dname "CN=omnigent production ephemeral"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-sign debug APK
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apksigner="$bt/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass "file:$RUNNER_TEMP/ks-pass" \
            --ks-key-alias "$(cat "$RUNNER_TEMP/key-alias")" \
            --key-pass "file:$RUNNER_TEMP/key-pass" \
            unsigned/omnigent-production-debug.apk
          "$apksigner" verify unsigned/omnigent-production-debug.apk
          {
            echo "## APK signing certificate"
            echo '```'
            "$apksigner" verify --print-certs unsigned/omnigent-production-debug.apk | grep -i "SHA-256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-assets
          path: unsigned/omnigent-production-debug.apk

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — android-sign job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Secretless like android-build: executes third-party pnpm/electron build
  # code from the merged PRs — no secrets, no persisted git credentials.
  # macOS artifacts ship unsigned (identity nulled): first launch needs
  # right-click-Open or an xattr quarantine strip; fine for self-testing.
  desktop-build:
    needs: compose
    if: needs.compose.outputs.tag != ''
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the production commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.compose.outputs.production_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
          standalone: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # arm64-only keeps the job light; the dmg installs, the zip feeds
      # drag-free upgrades. Identity is nulled because the config pins the
      # Databricks signing cert, which this ring must never hold.
      - name: Build macOS desktop app (unsigned, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          pnpm --filter web run build:overlay
          # --dir, not --filter: a filter that matches nothing makes pnpm
          # exec a silent no-op, and this build must never no-op quietly.
          pnpm --dir web/electron exec electron-builder --mac dmg zip --arm64 -c.mac.identity=null

      # Hand off exactly two files under fixed names from a fresh dir —
      # stable release-asset URLs, and no smuggling across the boundary.
      - name: Stage build outputs
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/desktop"
          mkdir -p "$RUNNER_TEMP/desktop"
          dmg=(web/electron/dist/*.dmg)
          zip=(web/electron/dist/*-mac.zip)
          [ ${#dmg[@]} -eq 1 ] && [ -f "${dmg[0]}" ] || { echo "expected exactly one dmg, got: ${dmg[*]}"; exit 1; }
          [ ${#zip[@]} -eq 1 ] && [ -f "${zip[0]}" ] || { echo "expected exactly one mac zip, got: ${zip[*]}"; exit 1; }
          cp "${dmg[0]}" "$RUNNER_TEMP/desktop/omnigent-production-arm64.dmg"
          cp "${zip[0]}" "$RUNNER_TEMP/desktop/omnigent-production-arm64-mac.zip"

      - name: Upload desktop assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-assets
          path: |
            ${{ runner.temp }}/desktop/omnigent-production-arm64.dmg
            ${{ runner.temp }}/desktop/omnigent-production-arm64-mac.zip

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — desktop-build job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [compose, android-sign, desktop-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.compose.outputs.tag }}
      PRODUCTION_SHA: ${{ needs.compose.outputs.production_sha }}
    steps:
      - name: Checkout (for the release script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download merge report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merge-report
          path: report

      - name: Download Android assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-assets
          path: assets

      - name: Download desktop assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-assets
          path: desktop

      # dist is rebuilt from scratch out of explicitly named files; anything
      # unexpected in any artifact fails the publish.
      - name: Assemble release assets, notes, checksums
        env:
          SIGNED: ${{ needs.android-sign.outputs.signed }}
        run: |
          set -euo pipefail
          got="$(find report assets desktop -mindepth 1 | LC_ALL=C sort | paste -sd' ' -)"
          want="assets/omnigent-production-debug.apk desktop/omnigent-production-arm64-mac.zip desktop/omnigent-production-arm64.dmg report/merge-report.json"
          if [ "$got" != "$want" ]; then
            echo "unexpected artifact contents: $got"
            exit 1
          fi
          rm -rf dist && mkdir dist
          cp report/merge-report.json \
            assets/omnigent-production-debug.apk \
            desktop/omnigent-production-arm64.dmg \
            desktop/omnigent-production-arm64-mac.zip dist/
          python3 .github/scripts/personal-staging/stage.py notes \
            --report dist/merge-report.json --signed "$SIGNED" --ring production > notes.md
          (cd dist && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Idempotent for same-day reruns: refresh the notes when the release
      # already exists, then clobber-upload assets either way.
      - name: Publish dated prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --prerelease \
              --title "Personal production $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber

      # Floating prerelease: the tag is (re)pointed FIRST so a partial state
      # (tag exists, release missing) can never pin the release to a stale
      # commit; the release is then edited in place (no delete/recreate, so
      # the stable releases/download/production-latest/<asset> URL never 404s).
      - name: Update production-latest
        env:
          # App tokens cannot update refs containing workflow-file changes;
          # prefer the workflows-scoped PAT, with GitHub token as fallback.
          GH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/production-latest" \
            -f sha="$PRODUCTION_SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/production-latest" -f sha="$PRODUCTION_SHA"
          if gh release view production-latest >/dev/null 2>&1; then
            gh release edit production-latest --prerelease \
              --title "Personal production (latest — $TAG)" --notes-file notes.md
          else
            gh release create production-latest --prerelease \
              --title "Personal production (latest — $TAG)" --notes-file notes.md
          fi
          gh release upload production-latest dist/* --clobber

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — publish job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Failure alert routed to Home Assistant via the homelab hooks gateway
  # (spec decision 13). Best-effort by contract: the receiver may not be live
  # yet, and alerting must never make a red run harder to read — the curl
  # can only warn, never fail.
  alert-failure:
    needs: [test-composer, compose, android-build, android-sign, desktop-build, publish]
    if: failure() && github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Home Assistant
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' \
            "omnigent production nightly FAILED — $RUN_URL")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"
