# Nightly personal production ring for the btli fork.
#
# Composes fork branch `production` = upstream main + every open NON-draft
# btli PR (no extras, no dev tag — draft status is the promotion gate) and
# pins an immutable production-YYYYMMDD branch + tag, the pin homelab's
# build-omnigent-production.yml resolves at 11:10 UTC. Compose + pin only:
# no APK, no releases, no image dispatch (those stay on the staging nightly).
#
# Migration gate (schema safety, spec decision 11): stage.py itself refuses
# the atomic push when the candidate touches omnigent/db/migrations/versions/
# — versus upstream main OR the previous production pin — unless this run was
# dispatched with approve_migration=<that exact candidate sha>. A blocked run
# is a SUCCESS outcome (green): it alerts via ha-notify and waits for the
# operator to re-dispatch after the CNPG backup checkpoint (homelab runbook).
#
# Trust boundary: same shape as personal-staging.yml — the test gate runs
# third-party dev deps secretless; the compose job is privileged (pushes
# refs) but runs only the stdlib composer. ha-notify POSTs are HMAC-signed
# and always best-effort: CI never holds an HA API token (the in-cluster
# receiver does), and an unreachable receiver only warns.
name: Personal Production Nightly

on:
  schedule:
    # After the staging nightly's 10:00 UTC slot, before homelab's 11:10 UTC
    # poll of the production-YYYYMMDD pin. Off :00 like the other rings.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      approve_migration:
        description: >-
          Full 40-hex candidate sha: publishes a migration-touching
          composition after the CNPG backup checkpoint (see the homelab
          runbook). Leave empty for a normal run.
        type: string
        default: ""

permissions:
  contents: read

# Own group: the production compose must never cancel (or be cancelled by)
# the staging nightly/hourly runs — different groups already guarantee that.
# cancel-in-progress stays false so an operator approve_migration dispatch
# queues behind a running compose instead of killing it mid-push.
concurrency:
  group: personal-production
  cancel-in-progress: false

jobs:
  # Secretless test gate — same contract as personal-staging.yml: `uv run`
  # installs third-party dev deps, so this job never holds a write token
  # (the repo's default pytest testpaths never collect .github/scripts/**,
  # hence the explicit run here).
  test-composer:
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Test the staging composer
        run: uv run --frozen --group dev python -m pytest .github/scripts/personal-staging/

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — test-composer job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  compose:
    needs: test-composer
    # Accident prevention for non-main dispatches (schedule always runs main);
    # a dispatched ref executes its own workflow copy, so this is not a
    # security boundary — see personal-staging.yml's integrate job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # App tokens cannot push workflow-file changes; prefer the
          # workflows-scoped PAT, with GitHub token as fallback.
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Compose production from upstream main + open non-draft btli PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on schedule runs; the gate compares it to the candidate sha.
          APPROVE_MIGRATION: ${{ inputs.approve_migration }}
        run: |
          set -euo pipefail
          # Preflight identity for git merge --no-ff --no-commit; stage.py's
          # COMMIT_IDENT -c overrides set the reproducible composition
          # identities (same rationale as personal-staging.yml).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          python3 .github/scripts/personal-staging/stage.py stage --ring production \
            --migration-approval "$APPROVE_MIGRATION" \
            --upstream-remote upstream --fork-remote origin \
            --report merge-report.json

      # Blocked is a SUCCESS outcome: the composer already refused the push
      # and wrote the BLOCKED step summary; this step only raises the alert.
      - name: Alert when the migration gate blocked the pin
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          blocked=$(jq -r '.migration_gate.blocked // false' merge-report.json)
          if [ "$blocked" != "true" ]; then
            exit 0
          fi
          candidate=$(jq -r '.migration_gate.candidate' merge-report.json)
          echo "::notice::migration gate blocked candidate $candidate — no refs pushed; blocked is a success outcome"
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          msg="omnigent production migration gate BLOCKED candidate $candidate (touches omnigent/db/migrations/versions/). Pin NOT published. After a verified-completed CNPG Backup, re-dispatch personal-production.yml with approve_migration=$candidate (homelab runbook). $RUN_URL"
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"

      - name: Upload merge report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-report
          path: merge-report.json

      - name: Report failure
        if: failure()
        run: echo "## Personal production nightly — compose job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Failure alert routed to Home Assistant via the homelab hooks gateway
  # (spec decision 13). Best-effort by contract: the receiver may not be live
  # yet, and alerting must never make a red run harder to read — the curl
  # can only warn, never fail.
  alert-failure:
    needs: [test-composer, compose]
    if: failure() && github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Home Assistant
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' \
            "omnigent production nightly FAILED — $RUN_URL")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"
