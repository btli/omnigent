# Promote a soaked staging nightly to production by reusing its artifacts.
#
# Triggers: a `soak/homelab` commit status (enabled by repo variable
# SOAK_STATUS_LOGIN; promote.py re-reads the statuses and trusts only that
# login's newest verdict), or a manual dispatch. promote.py decides (spec docs/superpowers/specs/
# 2026-10-09-ring-soak-promote-design.md); this workflow only moves the bytes
# and refs the plan names, in the spec's publish order: draft release, images,
# pin, then switch (production-latest moves LAST, it is what homelab watches).
#
# Trust boundary: the test gate runs third-party dev deps secretless. The
# privileged promote job checks out trusted main only and runs nothing but the
# stdlib promote.py/stage.py plus gh, jq and docker; it never checks out or
# executes the nightly's code. Inputs and plan fields reach shell via env/jq.
# Status runs execute the default branch's definition: github.ref is main
# and github.sha is main's head, so the checkouts below stay on trusted main.
name: Personal Promote

on:
  # Every commit status in the repo starts a run; the job gates drop all but
  # actionable soak/homelab verdicts before any job (or lock) is taken.
  status:
  workflow_dispatch:
    inputs:
      nightly:
        description: "nightly-YYYYMMDD[-rerunN] tag to promote"
        required: true
        type: string
      approve_migration:
        description: >-
          Full 40-hex candidate sha approving a migration-touching promotion
          (after the CNPG backup checkpoint). Leave empty otherwise.
        type: string
        default: ""
      allow_older:
        description: "Allow promoting a nightly older than production's source (rollback)"
        type: boolean
        default: false
      dry_run:
        description: "Only print the plan; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Secretless test gate: `uv run` installs third-party dev deps, so this job
  # never holds a write token.
  test-promote:
    # Status events act only on a soak/homelab verdict and only once
    # SOAK_STATUS_LOGIN is set; pending verdicts are never actionable.
    if: >-
      github.repository == 'btli/omnigent' && github.ref == 'refs/heads/main'
      && (github.event_name != 'status'
        || (github.event.context == 'soak/homelab' && github.event.state != 'pending'
          && vars.SOAK_STATUS_LOGIN != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Test the promote planner
        run: uv run --frozen --group dev python -m pytest .github/scripts/personal-staging/test_promote.py

  promote:
    needs: test-promote
    # Status events act only on a soak/homelab verdict and only once
    # SOAK_STATUS_LOGIN is set; pending verdicts are never actionable.
    if: >-
      github.repository == 'btli/omnigent' && github.ref == 'refs/heads/main'
      && (github.event_name != 'status'
        || (github.event.context == 'soak/homelab' && github.event.state != 'pending'
          && vars.SOAK_STATUS_LOGIN != ''))
    # One promote at a time, never cancelled: plan + pin under this lock is
    # what keeps a single production tag per sha. Job-level so the status
    # events the gate skips never take the lock's single pending slot.
    concurrency:
      group: personal-promote
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Migration diffs need full history and tags; the token lets pin push.
      # Pinned to the commit test-promote tested, not wherever main has moved.
      - name: Checkout trusted main with tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      # A status run passes only the event sha and the trusted login; the
      # dispatch-only approve_migration/allow_older never reach it.
      - name: Plan
        id: plan
        env:
          NIGHTLY: ${{ inputs.nightly }}
          APPROVE_MIGRATION: ${{ inputs.approve_migration }}
          ALLOW_OLDER: ${{ inputs.allow_older }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_SHA: ${{ github.event.sha }}
          SOAK_LOGIN: ${{ vars.SOAK_STATUS_LOGIN }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          if [ "$GITHUB_EVENT_NAME" = "status" ]; then
            args=(--trigger status --sha "$EVENT_SHA" --soak-login "$SOAK_LOGIN")
          else
            args=(--trigger dispatch --nightly "$NIGHTLY" --approve-migration "$APPROVE_MIGRATION")
            if [ "$ALLOW_OLDER" = "true" ]; then
              args+=(--allow-older)
            fi
          fi
          rc=0
          python3 .github/scripts/personal-staging/promote.py plan \
            --repo "$GITHUB_REPOSITORY" --fork-remote origin \
            "${args[@]}" --out "$plan" || rc=$?
          if [ ! -s "$plan" ]; then
            echo "::error::promote.py plan wrote no plan (exit $rc)"
            exit 1
          fi
          {
            echo "## Promote plan"
            echo '```json'
            cat "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          action=$(jq -r '.action' "$plan")
          case "$action" in
            promote|noop|blocked|refused|ignored) ;;
            error)
              echo "::error::promote plan error: $(jq -r '.reason' "$plan")"
              exit 1
              ;;
            *)
              echo "::error::unknown promote plan action: $action"
              exit 1
              ;;
          esac
          publish=false
          if [ "$action" = "promote" ] && [ "$DRY_RUN" != "true" ]; then
            publish=true
          fi
          {
            echo "action=$action"
            echo "publish=$publish"
            echo "state=$(jq -r '.state // ""' "$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Stop on refused plan
        if: steps.plan.outputs.action == 'refused'
        run: |
          echo "::error::promote refused: $(jq -r '.reason' "$RUNNER_TEMP/plan.json")"
          exit 1

      - name: Report no-op
        if: steps.plan.outputs.action == 'noop' || steps.plan.outputs.action == 'ignored'
        run: |
          set -euo pipefail
          reason=$(jq -r '.reason' "$RUNNER_TEMP/plan.json")
          echo "::notice::nothing to promote: $reason"
          echo "Nothing to promote: $reason" >> "$GITHUB_STEP_SUMMARY"

      # A failed soak publishes nothing and the run stays green; the alert is
      # the signal. Best-effort, like every ha-notify call here.
      - name: Alert on a failed soak verdict
        if: >-
          steps.plan.outputs.action == 'ignored'
          && (steps.plan.outputs.state == 'failure' || steps.plan.outputs.state == 'error')
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          STATE: ${{ steps.plan.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          sha=$(jq -r '.sha // "unknown sha"' "$plan")
          nightly=$(jq -r '.nightly // "no nightly tag"' "$plan")
          msg="soak $STATE for $sha ($nightly) — $RUN_URL"
          echo "::warning::$msg"
          echo "Soak verdict: $msg" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"

      # Blocked is a SUCCESS outcome: nothing is published, the operator
      # re-dispatches with the approval after the CNPG backup checkpoint.
      - name: Alert on blocked migration gate
        if: steps.plan.outputs.action == 'blocked'
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          nightly=$(jq -r '.nightly' "$plan")
          hint=$(jq -r '.gate.approval_hint' "$plan")
          echo "::notice::migration gate blocked $nightly — nothing published. $hint"
          echo "BLOCKED (migrations): $hint" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          msg="omnigent promote BLOCKED $nightly (migrations): $hint $RUN_URL"
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"

      - name: Report dry run
        if: steps.plan.outputs.action == 'promote' && inputs.dry_run
        run: |
          set -euo pipefail
          tag=$(jq -r '.production_tag' "$RUNNER_TEMP/plan.json")
          echo "::notice::dry run: would promote to $tag; nothing published"
          echo "Dry run: would promote to \`$tag\`; nothing published." >> "$GITHUB_STEP_SUMMARY"

      # Step 1 of the publish order. Assets are checked against
      # build-complete.json before anything is uploaded under production names.
      - name: Copy and verify assets into a draft production release
        id: draft
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          nightly=$(jq -r '.nightly' "$plan")
          tag=$(jq -r '.production_tag' "$plan")
          sha=$(jq -r '.sha' "$plan")
          dl="$RUNNER_TEMP/dl"
          dist="$RUNNER_TEMP/dist"
          rm -rf "$dl" "$dist"
          mkdir -p "$dl" "$dist"
          jq '{assets: .assets}' "$plan" > "$RUNNER_TEMP/manifest.json"
          patterns=()
          while IFS= read -r name; do
            patterns+=(-p "$name")
          done < <(jq -r '.assets | keys[]' "$plan")
          if [ "${#patterns[@]}" -eq 0 ]; then
            echo "::error::plan lists no assets"
            exit 1
          fi
          gh release download "$nightly" -D "$dl" "${patterns[@]}"
          python3 .github/scripts/personal-staging/promote.py verify-assets \
            --manifest "$RUNNER_TEMP/manifest.json" --dir "$dl"
          if [ ! -f "$dl/merge-report.json" ]; then
            echo "::error::$nightly lists no merge-report.json to render notes from"
            exit 1
          fi
          # The nightly's checksums and marker describe staging names; promote
          # writes its own SHA256SUMS over the production set.
          for f in "$dl"/*; do
            b=$(basename "$f")
            case "$b" in
              SHA256SUMS|build-complete.json) continue ;;
            esac
            cp "$f" "$dist/${b/#omnigent-staging-/omnigent-production-}"
          done
          jq '.source' "$plan" > "$dist/source.json"
          (cd "$dist" && sha256sum ./* > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS)
          notes="$RUNNER_TEMP/notes.md"
          python3 .github/scripts/personal-staging/stage.py notes \
            --report "$dl/merge-report.json" --signed true --ring production > "$notes"
          cat >> "$notes" <<'DESKTOP_NOTES'

          ## macOS desktop
          Ad-hoc signed, not notarized. After installing from the dmg, clear
          quarantine once: `xattr -dr com.apple.quarantine /Applications/Omnigent.app`
          DESKTOP_NOTES
          printf '\nPromoted from %s (%s).\n' "\`$nightly\`" "\`$sha\`" >> "$notes"
          # An existing release is a resume or a rollback onto an older tag:
          # refresh it in place, never delete or recreate it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --draft --prerelease --target "$sha" \
              --title "Personal production $tag" --notes-file "$notes"
            # A file, not a step output: cleanup must see it even if this
            # step is cancelled before its outputs are processed.
            echo "$tag" > "$RUNNER_TEMP/draft-created"
          fi
          gh release upload "$tag" "$dist"/* --clobber
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        if: steps.plan.outputs.publish == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Step 2: retag the soaked images by digest; no rebuild.
      - name: Retag images by digest
        id: images
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          tag=$(jq -r '.production_tag' "$plan")
          sha=$(jq -r '.sha' "$plan")
          server=$(jq -r '.images.server' "$plan")
          host=$(jq -r '.images.host' "$plan")
          for digest in "$server" "$host"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::not an image digest: $digest"
              exit 1
            fi
          done
          short="${sha:0:12}"
          docker buildx imagetools create \
            -t "ghcr.io/btli/omnigent-server:${tag}" -t "ghcr.io/btli/omnigent-server:sha-${short}" \
            "ghcr.io/btli/omnigent-server@${server}"
          docker buildx imagetools create \
            -t "ghcr.io/btli/omnigent-host:${tag}" -t "ghcr.io/btli/omnigent-host:sha-${short}" \
            "ghcr.io/btli/omnigent-host@${host}"

      # Before the pin, a failed or cancelled run leaves production untouched:
      # drop the draft only if this run created it and it is still a draft.
      - name: Delete the draft if publishing stopped before the pin
        if: (failure() || cancelled()) && steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/draft-created"
          if [ ! -f "$marker" ]; then
            echo "this run created no draft release"
            exit 0
          fi
          tag=$(cat "$marker")
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo unknown)
          if [ "$draft" = "true" ]; then
            gh release delete "$tag" --yes
            echo "::notice::deleted draft release $tag"
          else
            echo "::warning::left release $tag in place (isDraft=$draft)"
          fi

      # Step 3: idempotent, and refuses a tag that already sits at another sha.
      - name: Pin the production tag
        id: pin
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          python3 .github/scripts/personal-staging/promote.py pin \
            --sha "$(jq -r '.sha' "$plan")" --tag "$(jq -r '.production_tag' "$plan")" \
            --fork-remote origin

      # Step 4: switch. From here on a rerun resumes at the existing tag.
      - name: Publish the production release
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag=$(jq -r '.production_tag' "$RUNNER_TEMP/plan.json")
          gh release edit "$tag" --draft=false --prerelease

      - name: Move the production-nightly image channel
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          server=$(jq -r '.images.server' "$plan")
          host=$(jq -r '.images.host' "$plan")
          docker buildx imagetools create -t "ghcr.io/btli/omnigent-server:production-nightly" "ghcr.io/btli/omnigent-server@${server}"
          docker buildx imagetools create -t "ghcr.io/btli/omnigent-host:production-nightly" "ghcr.io/btli/omnigent-host@${host}"

      # Floating prerelease, moved LAST: the tag is (re)pointed first so a
      # partial state can never pin the release to a stale commit; the release
      # is edited in place so its stable download URLs never 404.
      - name: Update production-latest
        if: steps.plan.outputs.publish == 'true'
        env:
          # App tokens cannot update refs containing workflow-file changes;
          # prefer the workflows-scoped PAT, with GitHub token as fallback.
          GH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          tag=$(jq -r '.production_tag' "$plan")
          sha=$(jq -r '.sha' "$plan")
          nightly=$(jq -r '.nightly' "$plan")
          notes="$RUNNER_TEMP/notes.md"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/production-latest" \
            -f sha="$sha" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/production-latest" -f sha="$sha"
          if gh release view production-latest >/dev/null 2>&1; then
            gh release edit production-latest --prerelease \
              --title "Personal production (latest — $tag)" --notes-file "$notes"
          else
            gh release create production-latest --prerelease \
              --title "Personal production (latest — $tag)" --notes-file "$notes"
          fi
          # source.json goes last: its sha is what tells a rerun the switch
          # finished (promote.py plan only plans noop once it matches).
          assets=()
          for f in "$RUNNER_TEMP/dist"/*; do
            if [ "$(basename "$f")" != "source.json" ]; then
              assets+=("$f")
            fi
          done
          gh release upload production-latest "${assets[@]}" --clobber
          gh release upload production-latest "$RUNNER_TEMP/dist/source.json" --clobber
          echo "Promoted \`$nightly\` (\`$sha\`) to \`$tag\` and production-latest." >> "$GITHUB_STEP_SUMMARY"

  # Best-effort by contract: the curl can only warn, never fail, so alerting
  # never makes a red run harder to read.
  alert-failure:
    needs: [test-promote, promote]
    if: (failure() || cancelled()) && github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Home Assistant
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' \
            "omnigent promote FAILED — $RUN_URL")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"
