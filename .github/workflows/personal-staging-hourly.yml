# Hourly personal staging refresh for the btli fork.
#
# Keeps fork branch `staging` = upstream main + open btli PRs + extras.txt
# pins between nightlies, via `stage.py stage --staging-only`: no nightly
# pins, no dev tags, no APK/releases/images — those stay on the nightly
# (personal-staging.yml). Composition is byte-reproducible, so an unchanged
# hour is a skipped push ("unchanged" in the summary).
name: Personal Staging Hourly

on:
  schedule:
    # Off the top of the hour on purpose: :00 would collide with the nightly's
    # 10:00 UTC slot (both push fork main), and GitHub delays or drops runs
    # scheduled on the congested :00 minute.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Deliberately NOT the nightly's `personal-staging` group: hourly runs
# coalesce via cancel-in-progress, and sharing the group would let an hourly
# run cancel a running nightly. A rare push race with the nightly resolves
# loudly via --force-with-lease; a lost lease here is acceptable — the next
# hourly run retries.
concurrency:
  group: personal-staging-hourly
  cancel-in-progress: true

jobs:
  # Soft-fail twin of the nightly's sync-main: keep fork main tracking
  # upstream, but a content conflict only warns (abort + summary + exit 0) —
  # the compose job stacks from upstream HEAD and never reads fork main,
  # and hourly noise for a conflict the nightly already reports helps nobody.
  # Soft-fail is classified, not blanket: only a genuine content conflict
  # (unmerged paths) or a confirmed stale-ref push rejection soft-fails;
  # auth, permissions, transport, or any other merge/push failure stays loud.
  sync-main:
    # Fork-only, and main-only for the same accident-prevention reason as the
    # compose job below: a dispatched ref runs its own workflow copy, so this
    # guard is not a server-enforced boundary — it just keeps a stray dispatch
    # from pushing fork main with this job's write token.
    if: github.repository == 'btli/omnigent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout fork main with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # App tokens cannot push workflow-file changes; prefer the
          # workflows-scoped PAT, with GitHub token as fallback.
          # PAT pushes trigger workflows, so PAT merges force a [skip ci] commit.
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
          ref: main
          fetch-depth: 0

      - name: Merge upstream main and push (soft-fail on conflict)
        env:
          HAS_PAT: ${{ secrets.STAGING_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          git fetch upstream main

          soft_fail() {
            { echo "## sync-main: $1"; echo ""; printf '%s\n' "$2"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::sync-main: $1 (see step summary) — this hour's staging compose still runs from upstream HEAD"
            exit 0
          }

          # Same rule the composer applies: only genuine content conflicts
          # (unmerged index entries) are skippable. A bad object or a transport
          # error must stay loud instead of hiding behind an hourly warning.
          merge_or_soft_fail() {
            if [ "$HAS_PAT" = "true" ]; then
              git merge --no-ff -m "Merge upstream main [skip ci]" "$1" && return 0
            else
              git merge --no-edit "$1" && return 0
            fi
            if [ -z "$(git ls-files -u)" ]; then
              echo "::error::sync-main: git merge failed with no conflicting paths — not a content conflict"
              exit 1
            fi
            paths="$(git diff --name-only --diff-filter=U | while read -r f; do printf -- '- %s\n' "\`$f\`"; done)"
            git merge --abort
            soft_fail "merge conflict with upstream main — resolve manually" "$paths"
          }

          # Soft-fail ONLY a confirmed non-fast-forward / stale-ref rejection
          # on refs/heads/main, classified from `git push --porcelain` status
          # lines (stage.py is-stale-ref-rejection) — never from free-form
          # stderr. Auth, permissions, transport, or [remote rejected] hooks
          # must fail the step — same discipline as merge_or_soft_fail above.
          is_stale_ref_rejection() {
            printf '%s\n' "$1" | python3 .github/scripts/personal-staging/stage.py \
              is-stale-ref-rejection
          }

          merge_or_soft_fail FETCH_HEAD
          # Porcelain status → stdout; prose errors → stderr. Classify stdout only.
          if ! push_out=$(git push --porcelain origin main 2>push_err.txt); then
            cat push_err.txt >&2
            printf '%s\n' "$push_out" >&2
            if ! is_stale_ref_rejection "$push_out"; then
              echo "::error::sync-main: git push failed (not a stale-ref race)"
              exit 1
            fi
            # Lost a race (the nightly, or a human push). Integrate and retry
            # once; never force-push main.
            git fetch origin main
            merge_or_soft_fail FETCH_HEAD
            if ! push_out=$(git push --porcelain origin main 2>push_err.txt); then
              cat push_err.txt >&2
              printf '%s\n' "$push_out" >&2
              if is_stale_ref_rejection "$push_out"; then
                soft_fail "could not push fork main" \
                  "Lost the push race twice; the next hourly run retries."
              fi
              echo "::error::sync-main: git push failed after retry (not a stale-ref race)"
              exit 1
            fi
          fi

  # Secretless test gate: `uv run` installs third-party dev deps, so this job
  # never holds a write token (the repo's default pytest testpaths never
  # collect .github/scripts/**, hence the explicit run here).
  test-composer:
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Test the staging composer
        run: uv run --frozen --group dev python -m pytest .github/scripts/personal-staging/

  # Privileged (pushes refs/heads/staging) but runs ONLY the stdlib composer.
  # Independent of sync-main by design: staging stacks from upstream HEAD,
  # never fork main.
  compose:
    needs: test-composer
    # Accident prevention for non-main dispatches (schedule always runs main);
    # a dispatched ref executes its own workflow copy, so this is not a
    # security boundary — see the nightly workflow's integrate job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # App tokens cannot push workflow-file changes; prefer the
          # workflows-scoped PAT, with GitHub token as fallback.
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Compose staging from upstream main + open btli PRs + extras
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # git merge --no-ff --no-commit checks identity before the composer reaches
          # its commit phase (run 31338098075 failed here). This identity is preflight-only;
          # stage.py's COMMIT_IDENT -c overrides set reproducible staging commit identities.
          # Do not use GIT_AUTHOR_* / GIT_COMMITTER_* env instead: env beats -c,
          # changing those identities and breaking same-day SHA reproducibility.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          python3 .github/scripts/personal-staging/stage.py stage --staging-only \
            --upstream-remote upstream --fork-remote origin \
            --report merge-report.json

      - name: Upload merge report
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-report
          path: merge-report.json

      - name: Report failure
        if: failure()
        run: echo "## Personal staging hourly — compose job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  seed-staleness-monitor:
    name: monitor composition regressions
    needs: compose
    if: always() && needs.compose.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout detector
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download current merge report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merge-report
          path: reports/current

      - name: Compare with previous successful composition
        id: compare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runs = (await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'personal-staging-hourly.yml', branch: context.ref.replace('refs/heads/', ''),
              status: 'success', per_page: 20,
            })).data.workflow_runs
              .filter(run => run.run_number < context.runNumber)
              .sort((a, b) => b.run_number - a.run_number);
            let report;
            for (const run of runs) {
              const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              })).data.artifacts;
              report = artifacts.find(item => item.name === 'merge-report' && !item.expired);
              if (report) break;
            }
            if (report) {
              const archive = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: report.id, archive_format: 'zip',
              });
              fs.writeFileSync('previous.zip', Buffer.from(archive.data));
              core.setOutput('has_baseline', 'true');
            } else {
              core.info('no prior report artifact -- using an empty first-run baseline');
              core.setOutput('has_baseline', 'false');
            }

      - name: Run detector
        env:
          HAS_BASELINE: ${{ steps.compare.outputs.has_baseline }}
        run: |
          if [ "$HAS_BASELINE" = "true" ]; then
            unzip -q previous.zip -d reports/previous
          else
            mkdir -p reports/previous
            printf '{"applied":[],"skipped":[]}\n' > reports/previous/merge-report.json
          fi
          python3 .github/scripts/personal-staging/detect_staleness.py \
            reports/previous/merge-report.json reports/current/merge-report.json \
            --output staleness.json

      - name: Update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('staleness.json', 'utf8'));
            const { owner, repo } = context.repo;
            const LABEL = 'staging-seed-stale-hourly';
            const title = 'Personal staging composition regression (hourly)';
            const existing = (await github.rest.issues.listForRepo({
              owner, repo, state: 'all', labels: LABEL, per_page: 100,
            })).data.find(issue => issue.title === title && !issue.pull_request);
            if (!result.skipped_pins.length && !result.regressions.length) {
              if (existing?.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `Recovered in [run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
            catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205',
                description: 'Hourly personal staging composition has a skipped pin' });
            }
            const edgeIds = new Set([...result.regressions, ...result.new_pins].map(item => item.pr));
            const ongoing = result.skipped_pins
              .filter(item => !edgeIds.has(item.pr))
              .map(item => ({ pr: item.pr, current: item, ongoing: true }));
            const findings = [...result.regressions, ...result.new_pins, ...ongoing];
            const code = value => `\`${String(value).replaceAll('`', '\\`')}\``;
            const lines = findings.map(item => {
              const kind = result.regressions.includes(item) ? 'applied → skipped' : 'new pin skipped on first run';
              const status = item.ongoing ? 'still skipped' : kind;
              const seeded = item.previous_rerere_paths?.length ? `; prior rerere paths: ${item.previous_rerere_paths.map(code).join(', ')}` : '';
              const paths = item.current.conflict_paths?.map(code).join(', ') || code(item.current.reason || 'unknown');
              return `- **#${item.pr}**: ${status}; current conflict: ${paths}${seeded}`;
            });
            const body = [`High-severity staging composition regression in [run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}):`, '', ...lines].join('\n');
            if (existing) {
              if (existing.state === 'closed') await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open' });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            }
            else await github.rest.issues.create({ owner, repo, title, body, labels: [LABEL] });
