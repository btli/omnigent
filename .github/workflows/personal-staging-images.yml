name: Publish personal staging images

on:
  push:
    tags:
      - 'nightly-*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or ref to build; use an existing nightly-* tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: personal-staging-images
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'btli/omnigent'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.ref) || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source tag
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${INPUT_REF}" in
              nightly-*) source_ref="refs/tags/${INPUT_REF}" ;;
              *)
                echo "Dispatch ref must be a nightly-* tag name, got '${INPUT_REF}'." >&2
                exit 1
                ;;
            esac
          else
            source_ref="${GITHUB_REF_VALUE}"
          fi

          case "${source_ref}" in
            refs/tags/nightly-*) tag_name="${source_ref#refs/tags/}" ;;
            *)
              echo "Ref must resolve strictly to a nightly-* tag, got '${source_ref}'." >&2
              exit 1
              ;;
          esac

          if ! git check-ref-format "refs/tags/${tag_name}" >/dev/null; then
            echo "Invalid tag ref '${tag_name}'." >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse --verify --quiet "refs/tags/${tag_name}^{commit}")"; then
            echo "Tag '${tag_name}' was not found after checkout." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${tag_commit}" ]; then
            echo "Checkout is not at tag '${tag_name}'." >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short HEAD)"
          server_image='ghcr.io/btli/omnigent-server'
          host_image='ghcr.io/btli/omnigent-host'
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "server_tags=${server_image}:sha-${short_sha},${server_image}:${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "host_tags=${host_image}:sha-${short_sha},${host_image}:${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.source.outputs.server_tags }}
          cache-from: type=registry,ref=ghcr.io/btli/omnigent-server:buildcache
          cache-to: type=registry,ref=ghcr.io/btli/omnigent-server:buildcache,mode=max
          provenance: false
          sbom: true

      - name: Build and push host image
        id: build-host
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: host
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.source.outputs.host_tags }}
          cache-from: type=registry,ref=ghcr.io/btli/omnigent-host:buildcache
          cache-to: type=registry,ref=ghcr.io/btli/omnigent-host:buildcache,mode=max
          provenance: false
          sbom: true

      - name: Publish staging-nightly tags
        if: ${{ success() }}
        env:
          SERVER_DIGEST: ${{ steps.build-server.outputs.digest }}
          HOST_DIGEST: ${{ steps.build-host.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${SERVER_DIGEST}"
          test -n "${HOST_DIGEST}"
          docker buildx imagetools create \
            --tag ghcr.io/btli/omnigent-server:staging-nightly \
            "ghcr.io/btli/omnigent-server@${SERVER_DIGEST}"
          docker buildx imagetools create \
            --tag ghcr.io/btli/omnigent-host:staging-nightly \
            "ghcr.io/btli/omnigent-host@${HOST_DIGEST}"
