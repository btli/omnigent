name: Publish personal staging images

on:
  push:
    tags:
      - 'nightly-*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or ref to build; use an existing nightly-* tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - image: server
            target: runtime
          - image: host
            target: host
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source tag
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            source_ref="${INPUT_REF}"
          else
            source_ref="${REF_NAME}"
          fi
          tag_name="${source_ref##*/}"

          case "${tag_name}" in
            nightly-*) ;;
            *)
              echo "Ref must resolve to a nightly-* tag, got '${source_ref}'." >&2
              exit 1
              ;;
          esac

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          context: git
          images: ghcr.io/btli/omnigent-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.source.outputs.tag_name }}
            type=raw,value=staging-nightly

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
