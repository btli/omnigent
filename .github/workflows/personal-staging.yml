# Nightly personal staging ring for the btli fork.
#
# Composes upstream main + every open btli PR (sequential merges, conflicts
# skipped and reported) onto fork branch `staging`, pins an immutable
# testing-YYYYMMDD branch + tag and a PEP 440 vX.Y.Z.devYYYYMMDD tag, builds
# Android debug APK + unsigned release AAB from that commit, and publishes a
# prerelease (plus a floating `testing-latest` for a stable download URL).
#
# Never touches branch `testing` — that stays the manually composed
# webhook-deployed homelab branch (`just test-branch`).
name: Personal Staging Nightly

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-staging
  cancel-in-progress: false

jobs:
  integrate:
    # Fork-only, mirroring upstream's `if: github.repository == 'omnigent-ai/omnigent'`
    # guards; downstream jobs inherit the skip through `needs`.
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      staging_sha: ${{ steps.report.outputs.staging_sha }}
      tag: ${{ steps.report.outputs.tag }}
      date: ${{ steps.report.outputs.date }}
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Compose staging from upstream main + open btli PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          python3 .github/scripts/personal-staging/stage.py stage \
            --upstream-remote upstream --fork-remote origin \
            --report merge-report.json

      - name: Export report fields
        id: report
        run: |
          set -euo pipefail
          {
            echo "staging_sha=$(jq -r .staging_sha merge-report.json)"
            echo "tag=$(jq -r .tag merge-report.json)"
            echo "date=$(jq -r .date merge-report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload merge report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-report
          path: merge-report.json

  android:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    defaults:
      run:
        working-directory: web/android
    steps:
      - name: Checkout the staging commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.integrate.outputs.staging_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: false

      # Datestamp as versionCode keeps nightly installs monotonically
      # upgradeable on-device (fits comfortably under Android's 2.1e9 cap).
      - name: Build debug APK and unsigned release AAB
        env:
          VERSION_CODE: ${{ needs.integrate.outputs.date }}
        run: |
          ./gradlew assembleDebug bundleRelease --no-daemon --console=plain \
            -PversionCode="$VERSION_CODE"

      - name: Decode shared debug keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No OMNIGENT_DEBUG_KEYSTORE_B64 secret; keeping the runner-ephemeral debug signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Re-sign with the shared keystore so nightly APKs upgrade in place
      # on-device (gradle's own debug keystore is runner-ephemeral).
      - name: Re-sign debug APK with shared keystore
        if: steps.keystore.outputs.signed == 'true'
        env:
          OMNIGENT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_PASSWORD }}
          OMNIGENT_DEBUG_KEY_ALIAS: ${{ secrets.OMNIGENT_DEBUG_KEY_ALIAS }}
          OMNIGENT_DEBUG_KEY_PASSWORD: ${{ secrets.OMNIGENT_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass env:OMNIGENT_DEBUG_KEYSTORE_PASSWORD \
            --ks-key-alias "$OMNIGENT_DEBUG_KEY_ALIAS" \
            --key-pass env:OMNIGENT_DEBUG_KEY_PASSWORD \
            app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" verify app/build/outputs/apk/debug/app-debug.apk

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/assets/omnigent-staging-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/assets/omnigent-staging-release-unsigned.aab"

      - name: Upload Android assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-assets
          path: ${{ runner.temp }}/assets/*

  publish:
    needs: [integrate, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.integrate.outputs.tag }}
      STAGING_SHA: ${{ needs.integrate.outputs.staging_sha }}
    steps:
      - name: Checkout (for the release script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Assemble notes and checksums
        env:
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          set -euo pipefail
          python3 .github/scripts/personal-staging/stage.py notes \
            --report dist/merge-report.json --signed "$SIGNED" > notes.md
          (cd dist && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Idempotent for same-day reruns: create the dated prerelease if
      # missing, then clobber-upload assets either way.
      - name: Publish dated prerelease
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "Personal staging $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber

      # Floating prerelease: re-pointed every night so
      # releases/download/testing-latest/<asset> stays a stable URL.
      - name: Re-point testing-latest
        run: |
          set -euo pipefail
          gh release delete testing-latest --cleanup-tag --yes || true
          gh release create testing-latest --prerelease --target "$STAGING_SHA" \
            --title "Personal staging (latest — $TAG)" --notes-file notes.md
          gh release upload testing-latest dist/* --clobber
