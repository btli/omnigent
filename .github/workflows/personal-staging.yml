# Nightly personal staging ring for the btli fork.
#
# Composes fork main + fresh upstream main + every open btli PR (sequential merges, conflicts
# skipped and reported) onto fork branch `staging`, pins an immutable
# nightly-YYYYMMDD tag and a PEP 440 vX.Y.Z.devYYYYMMDD tag, verifies the web
# bundle builds, builds the `.dev` Android debug APK, the unsigned release AAB
# and the macOS desktop app from that commit, and publishes a prerelease (plus
# a floating `nightly-latest` for a stable download URL).
# Same-name compatibility branches were removed in v0.15.0.
# Composition gate: the nightly builds only when every PR and pin merged; any
# skipped entry produces a report, an alert and a red run instead of a build.
# Any other failed or cancelled nightly sends one ha-notify alert: no promote candidate.
#
# Trust boundary: jobs that execute third-party code (the test suite's dev
# deps in test-composer, merged PR code in verify, android-build and
# desktop-build) run secretless with
# credentials unpersisted and may not write shared caches. The privileged
# integrate job runs only the stdlib composer; the keystore only ever appears
# in android-sign, which re-signs the APK unconditionally so the untrusted
# build's own signature never ships. PAT-bearing jobs use the main-only
# staging-push environment so staging-tree workflows cannot receive the PAT;
# dev-tag pushes may enqueue release/image workflows, whose repo guards skip.
name: Personal Staging Nightly

on:
  schedule:
    # Intent: 3:00 AM Pacific. GitHub cron is UTC-only: 10:00 UTC is 3:00 AM PDT,
    # then 2:00 AM PST after November's DST change; winter is 0 11 * * *.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-staging
  cancel-in-progress: false

jobs:
  # Secretless test gate: `uv run` installs third-party dev deps, so this job
  # never holds a write token (the repo's default pytest testpaths never
  # collect .github/scripts/**, hence the explicit run here).
  test-composer:
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Test the staging composer
        run: uv run --frozen --group dev python -m pytest .github/scripts/personal-staging/ tests/db/test_ring_migration_history.py

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — test-composer job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  integrate:
    concurrency:
      group: personal-staging-nightly-compose
      cancel-in-progress: false
    # Privileged (pushes refs) but runs ONLY the stdlib composer — no
    # third-party code. Requires the secretless test gate to pass.
    needs: test-composer
    # The ref guard blocks accidental non-main dispatches of privileged jobs
    # (schedule always runs main). It is accident prevention only: a
    # dispatched ref executes its own workflow copy, so file-level guards
    # can't stop a malicious ref — the keystore's real protection is the
    # server-enforced staging-signing Environment on android-sign.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      staging_sha: ${{ steps.report.outputs.staging_sha }}
      tag: ${{ steps.report.outputs.tag }}
      date: ${{ steps.report.outputs.date }}
      complete: ${{ steps.gate.outputs.complete }}
      failed_count: ${{ steps.gate.outputs.failed_count }}
      failed_prs: ${{ steps.gate.outputs.failed_prs }}
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # App tokens cannot push workflow-file changes; prefer the
          # workflows-scoped PAT, with GitHub token as fallback.
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
          fetch-depth: 0

      # The composer leaves the work tree on the merged staging commit, so the
      # gate is copied out of the trusted main checkout before composing.
      - name: Snapshot the trusted composition gate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          cp .github/scripts/personal-staging/composition_gate.py "$RUNNER_TEMP/gate/"
          cp .github/scripts/personal-staging/stage.py "$RUNNER_TEMP/gate/"

      - name: Compose staging from fork main + fresh upstream main + open btli PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # git merge --no-ff --no-commit checks identity before the composer reaches
          # its commit phase (run 31338098075 failed here). This identity is preflight-only;
          # stage.py's COMMIT_IDENT -c overrides set reproducible staging commit identities.
          # Do not use GIT_AUTHOR_* / GIT_COMMITTER_* env instead: env beats -c,
          # changing those identities and breaking same-day SHA reproducibility.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          # Advance fork main to upstream first. A conflict (a fork-only
          # commit vs upstream) must not stop the nightly: alert, leave main
          # untouched, and compose on the old base with upstream as entry zero.
          if ! python3 .github/scripts/personal-staging/stage.py sync-main \
              --upstream-remote upstream --fork-remote origin; then
            echo "::warning::sync-main failed; composing on the previous fork main"
            echo "SYNC_MAIN_FAILED=1" >> "$GITHUB_ENV"
          fi
          python3 .github/scripts/personal-staging/stage.py stage \
            --upstream-remote upstream --fork-remote origin \
            --report merge-report.json

      - name: Alert when sync-main failed
        if: env.SYNC_MAIN_FAILED == '1'
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          msg="omnigent fork main could not merge upstream (sync-main conflict); staging composed on the previous base. $RUN_URL"
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"

      - name: Export report fields
        id: report
        run: |
          set -euo pipefail
          {
            echo "staging_sha=$(jq -r .staging_sha merge-report.json)"
            echo "tag=$(jq -r .tag merge-report.json)"
            echo "date=$(jq -r .date merge-report.json)"
          } >> "$GITHUB_OUTPUT"

      # Stdlib-only, run from the pre-compose snapshot. complete != true stops
      # verify and every build/publish job; composition-gate alerts and fails.
      - name: Check composition completeness
        id: gate
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/gate/composition_gate.py" \
            --report merge-report.json --summary "$RUNNER_TEMP/composition-report.md" \
            >> "$GITHUB_OUTPUT"
          {
            echo "failed_count=$(jq '.skipped | length' merge-report.json)"
            echo "failed_prs=$(jq -r '[.skipped[].pr | select(type == "number")] | .[:10] | map("#\(.)") | join(" ")' merge-report.json)"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/composition-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload composition report
        if: steps.gate.outputs.complete != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composition-report
          path: ${{ runner.temp }}/composition-report.md

      - name: Upload merge report
        if: always() && hashFiles('merge-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-report
          path: merge-report.json

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — integrate job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Secretless build gate: the nightly publishes immutable artifacts, so the web
  # bundle is built before any artifact job starts. This job executes third-party
  # npm lifecycle scripts from the merged PRs, so like android-build it gets no
  # secrets and no persisted git credentials.
  verify:
    needs: integrate
    # An incomplete composition never builds; the skip cascades to android-build,
    # android-sign, desktop-build and publish.
    if: needs.integrate.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the staging commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.integrate.outputs.staging_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
          standalone: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web bundle
        run: pnpm --filter web run build

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — verify job FAILED — the nightly does not build, so no artifacts were published" >> "$GITHUB_STEP_SUMMARY"

  # Incomplete composition: alert and fail the run red. Secretless except the
  # notify HMAC; no checkout and no merged code, only job outputs.
  composition-gate:
    needs: integrate
    if: needs.integrate.result == 'success' && needs.integrate.outputs.complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Alert that the nightly was not built
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_COUNT: ${{ needs.integrate.outputs.failed_count }}
          FAILED_PRS: ${{ needs.integrate.outputs.failed_prs }}
        run: |
          set -euo pipefail
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          msg="omnigent staging nightly NOT built: ${FAILED_COUNT:-?} PR(s) failed to merge — $RUN_URL"
          if [ -n "$FAILED_PRS" ]; then
            msg="$msg ($FAILED_PRS)"
          fi
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' "$msg")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"

      - name: Fail the run
        run: |
          echo "::error::Staging composition incomplete: nightly not built (see the composition-report artifact and the integrate job summary)"
          exit 1

  seed-staleness-monitor:
    name: monitor composition regressions
    needs: integrate
    if: always() && needs.integrate.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout detector
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download current merge report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merge-report
          path: reports/current

      - name: Compare with previous successful composition
        id: compare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const runs = (await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'personal-staging.yml', branch: context.ref.replace('refs/heads/', ''),
              per_page: 100,
            })).data.workflow_runs
              .filter(run => run.run_number < context.runNumber)
              .sort((a, b) => b.run_number - a.run_number);
            let report;
            for (const run of runs) {
              const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              })).data.artifacts;
              report = artifacts.find(item => item.name === 'merge-report' && !item.expired);
              if (report) break;
            }
            if (report) {
              const archive = await github.rest.actions.downloadArtifact({
                owner, repo, artifact_id: report.id, archive_format: 'zip',
              });
              fs.writeFileSync('previous.zip', Buffer.from(archive.data));
              core.setOutput('has_baseline', 'true');
            } else {
              core.info('no prior report artifact -- using an empty first-run baseline');
              core.setOutput('has_baseline', 'false');
            }

      - name: Run detector
        env:
          HAS_BASELINE: ${{ steps.compare.outputs.has_baseline }}
        run: |
          if [ "$HAS_BASELINE" = "true" ]; then
            unzip -q previous.zip -d reports/previous
          else
            mkdir -p reports/previous
            printf '{"applied":[],"skipped":[]}\n' > reports/previous/merge-report.json
          fi
          python3 .github/scripts/personal-staging/detect_staleness.py \
            reports/previous/merge-report.json reports/current/merge-report.json \
            --output staleness.json

      - name: Update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('staleness.json', 'utf8'));
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            if (!repository.data.has_issues) {
              core.notice('repository Issues are disabled; skipping staging regression tracking issue');
              return;
            }
            const LABEL = 'staging-seed-stale-nightly';
            const title = 'Personal staging composition regression (nightly)';
            const existing = (await github.rest.issues.listForRepo({
              owner, repo, state: 'all', labels: LABEL, per_page: 100,
            })).data.find(issue => issue.title === title && !issue.pull_request);
            if (!result.skipped_pins.length && !result.regressions.length) {
              if (existing?.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `No pin regressions or skipped pins remain in [run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
            catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205',
                description: 'Nightly personal staging composition has a skipped pin' });
            }
            const edgeIds = new Set([...result.regressions, ...result.new_pins].map(item => item.pr));
            const ongoing = result.skipped_pins
              .filter(item => !edgeIds.has(item.pr))
              .map(item => ({ pr: item.pr, current: item, ongoing: true }));
            const findings = [...result.regressions, ...result.new_pins, ...ongoing];
            const code = value => {
              const text = String(value);
              const runs = text.match(/`+/g) ?? [];
              const longest = Math.max(0, ...runs.map(run => run.length));
              const fence = '`'.repeat(longest + 1);
              const padding = text.startsWith('`') || text.endsWith('`') ? ' ' : '';
              return `${fence}${padding}${text}${padding}${fence}`;
            };
            const lines = findings.map(item => {
              const kind = result.regressions.includes(item) ? 'applied → skipped' : 'new pin skipped on first run';
              const status = item.ongoing ? 'still skipped' : kind;
              const seeded = item.previous_rerere_paths?.length ? `; prior rerere paths: ${item.previous_rerere_paths.map(code).join(', ')}` : '';
              const paths = item.current.conflict_paths?.map(code).join(', ') || code(item.current.reason || 'unknown');
              return `- **#${item.pr}**: ${status}; current conflict: ${paths}${seeded}`;
            });
            const body = [`High-severity staging composition regression in [run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}):`, '', ...lines].join('\n');
            if (existing) {
              if (existing.state === 'closed') await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open' });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            }
            else await github.rest.issues.create({ owner, repo, title, body, labels: [LABEL] });

  # Secretless: this job executes third-party gradle/build code from the
  # merged PRs, so it gets no secrets, no persisted git credentials, and
  # read-only access to the shared gradle cache (a poisoned cache write
  # would be restored by future runs).
  android-build:
    needs: [integrate, verify]
    # Build only after the ring composition and the web bundle succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/android
    steps:
      - name: Checkout the staging commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.integrate.outputs.staging_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache read-only)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: true

      # Datestamp as versionCode keeps nightly installs monotonically
      # upgradeable on-device (fits comfortably under Android's 2.1e9 cap).
      # The .dev id suffix keeps the debug APK installable alongside the
      # store-signed app; versionName carries the nightly tag for provenance.
      # The release AAB keeps the store id.
      - name: Build debug APK and unsigned release AAB
        env:
          VERSION_CODE: ${{ needs.integrate.outputs.date }}
          VERSION_NAME: ${{ needs.integrate.outputs.tag }}
        run: |
          ./gradlew assembleDebug --no-daemon --console=plain \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PapplicationIdSuffix=.dev
          ./gradlew bundleRelease --no-daemon --console=plain \
            -PversionCode="$VERSION_CODE"

      # Gradle silently ignores unknown -P properties, so a composition that
      # dropped the applicationIdSuffix support would rebuild the colliding
      # store id — fail loud instead of publishing that.
      - name: Verify package id
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          pkg="$("$bt/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [ "$pkg" != "ai.omnigent.android.dev" ]; then
            echo "::error::expected package id ai.omnigent.android.dev, got '$pkg' — applicationIdSuffix support missing from the composition?"
            exit 1
          fi

      # Hand off exactly two named files from a freshly created dir — the
      # build must not be able to smuggle extra files across the boundary.
      - name: Stage build outputs
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/unsigned"
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/unsigned/omnigent-staging-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/unsigned/omnigent-staging-release-unsigned.aab"

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned
          path: |
            ${{ runner.temp }}/unsigned/omnigent-staging-debug.apk
            ${{ runner.temp }}/unsigned/omnigent-staging-release-unsigned.aab

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — android-build job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Clean job for the keystore: only downloads the built artifact, never
  # checks out or executes merged code. The APK is ALWAYS re-signed here —
  # with the shared keystore when configured, else with a keystore minted in
  # this job — so the untrusted build's own signature never survives.
  android-sign:
    needs: android-build
    if: always() && needs.android-build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Server-enforced gate for the keystore secrets: the staging-signing
    # Environment carries the OMNIGENT_DEBUG_* secrets and a main-only
    # deployment-branch rule, so a dispatched non-main workflow copy can
    # never read them regardless of what its file says.
    environment: staging-signing
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download unsigned build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-unsigned
          path: unsigned

      - name: Verify artifact contents
        run: |
          set -euo pipefail
          got="$(find unsigned -mindepth 1 | LC_ALL=C sort | paste -sd' ' -)"
          want="unsigned/omnigent-staging-debug.apk unsigned/omnigent-staging-release-unsigned.aab"
          if [ "$got" != "$want" ]; then
            echo "unexpected artifact contents: $got"
            exit 1
          fi

      # Verified HERE, on the downloaded artifact and before any keystore
      # material exists in the job: the untrusted build job could shadow
      # zipfile / swap the file under a check running in its own runner.
      # The release AAB must ship unsigned (no release keystore on this
      # ring): its ZIP must carry no META-INF signature blocks at all.
      - name: Verify release AAB is unsigned
        run: |
          python3 - <<'EOF'
          import sys
          import zipfile

          names = zipfile.ZipFile("unsigned/omnigent-staging-release-unsigned.aab").namelist()
          sigs = [
              n
              for n in names
              if n.upper().startswith("META-INF/")
              and n.upper().endswith((".RSA", ".DSA", ".EC", ".SF"))
          ]
          sys.exit(f"release AAB carries signature blocks: {sigs}" if sigs else 0)
          EOF

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNIGENT_DEBUG_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.OMNIGENT_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            printf '%s' "$KS_PASS" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$KEY_PASS" > "$RUNNER_TEMP/key-pass"
            printf '%s' "$KEY_ALIAS" > "$RUNNER_TEMP/key-alias"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # No shared keystore: mint a run-ephemeral one (in-place upgrades
            # across nightlies won't work, flagged in the release notes).
            pass="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
            printf '%s' "$pass" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$pass" > "$RUNNER_TEMP/key-pass"
            printf '%s' "omnigent-ephemeral" > "$RUNNER_TEMP/key-alias"
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
              -alias omnigent-ephemeral -keyalg RSA -keysize 2048 -validity 30 \
              -storepass:file "$RUNNER_TEMP/ks-pass" \
              -keypass:file "$RUNNER_TEMP/key-pass" \
              -dname "CN=omnigent staging ephemeral"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-sign debug APK
        run: |
          set -euo pipefail
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apksigner="$bt/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass "file:$RUNNER_TEMP/ks-pass" \
            --ks-key-alias "$(cat "$RUNNER_TEMP/key-alias")" \
            --key-pass "file:$RUNNER_TEMP/key-pass" \
            unsigned/omnigent-staging-debug.apk
          "$apksigner" verify unsigned/omnigent-staging-debug.apk
          {
            echo "## APK signing certificate"
            echo '```'
            "$apksigner" verify --print-certs unsigned/omnigent-staging-debug.apk | grep -i "SHA-256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-assets
          path: |
            unsigned/omnigent-staging-debug.apk
            unsigned/omnigent-staging-release-unsigned.aab

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — android-sign job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Secretless like android-build: executes third-party pnpm/electron build
  # code from the merged PRs — no secrets, no persisted git credentials.
  # macOS artifacts ship unsigned (identity nulled): first launch needs
  # right-click-Open or an xattr quarantine strip; fine for self-testing.
  desktop-build:
    needs: [integrate, verify]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the staging commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.integrate.outputs.staging_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
          standalone: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # arm64-only keeps the job light; the dmg installs, the zip feeds
      # drag-free upgrades. Identity is nulled because the config pins the
      # Databricks signing cert, which this ring must never hold.
      - name: Build macOS desktop app (ad-hoc signed, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          pnpm --filter web run build:overlay
          # --dir, not --filter: a filter that matches nothing makes pnpm
          # exec a silent no-op, and this build must never no-op quietly.
          # Two phases with an ad-hoc re-sign between: a fully unsigned (or
          # stale-sealed) arm64 app dies as "damaged" even after the user
          # strips quarantine; ad-hoc keeps it launchable after xattr -dr.
          pnpm --dir web/electron exec electron-builder --mac dir --arm64 -c.mac.identity=null
          codesign --force --deep --sign - web/electron/dist/mac-arm64/Omnigent.app
          codesign --verify --deep --strict web/electron/dist/mac-arm64/Omnigent.app
          pnpm --dir web/electron exec electron-builder --mac dmg zip --arm64 -c.mac.identity=null \
            --prepackaged dist/mac-arm64/Omnigent.app

      # Hand off exactly two files under fixed names from a fresh dir —
      # stable release-asset URLs, and no smuggling across the boundary.
      - name: Stage build outputs
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/desktop"
          mkdir -p "$RUNNER_TEMP/desktop"
          dmg=(web/electron/dist/*.dmg)
          zip=(web/electron/dist/*-mac.zip)
          [ ${#dmg[@]} -eq 1 ] && [ -f "${dmg[0]}" ] || { echo "expected exactly one dmg, got: ${dmg[*]}"; exit 1; }
          [ ${#zip[@]} -eq 1 ] && [ -f "${zip[0]}" ] || { echo "expected exactly one mac zip, got: ${zip[*]}"; exit 1; }
          cp "${dmg[0]}" "$RUNNER_TEMP/desktop/omnigent-staging-arm64.dmg"
          cp "${zip[0]}" "$RUNNER_TEMP/desktop/omnigent-staging-arm64-mac.zip"

      - name: Upload desktop assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-assets
          path: |
            ${{ runner.temp }}/desktop/omnigent-staging-arm64.dmg
            ${{ runner.temp }}/desktop/omnigent-staging-arm64-mac.zip

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — desktop-build job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [integrate, android-sign, desktop-build]
    if: >-
      always() && needs.integrate.result == 'success'
      && needs.android-sign.result == 'success'
      && needs.desktop-build.result == 'success'
      && needs.integrate.outputs.complete == 'true'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-push
    timeout-minutes: 15
    permissions:
      contents: write
      # for chaining the image-build workflow_dispatch
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.integrate.outputs.tag }}
      STAGING_SHA: ${{ needs.integrate.outputs.staging_sha }}
    steps:
      - name: Checkout (for the release script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download merge report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merge-report
          path: report

      - name: Download Android assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-assets
          path: assets

      - name: Download desktop assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-assets
          path: desktop

      # dist is rebuilt from scratch out of explicitly named files; anything
      # unexpected in any artifact fails the publish.
      - name: Assemble release assets, notes, checksums
        env:
          SIGNED: ${{ needs.android-sign.outputs.signed }}
        run: |
          set -euo pipefail
          got="$(find report assets desktop -mindepth 1 | LC_ALL=C sort | paste -sd' ' -)"
          want="assets/omnigent-staging-debug.apk assets/omnigent-staging-release-unsigned.aab desktop/omnigent-staging-arm64-mac.zip desktop/omnigent-staging-arm64.dmg report/merge-report.json"
          if [ "$got" != "$want" ]; then
            echo "unexpected artifact contents: $got"
            exit 1
          fi
          rm -rf dist && mkdir dist
          cp report/merge-report.json \
            assets/omnigent-staging-debug.apk \
            assets/omnigent-staging-release-unsigned.aab \
            desktop/omnigent-staging-arm64.dmg \
            desktop/omnigent-staging-arm64-mac.zip dist/
          python3 .github/scripts/personal-staging/stage.py notes \
            --report dist/merge-report.json --signed "$SIGNED" > notes.md
          cat >> notes.md <<'DESKTOP_NOTES'

          ## macOS desktop
          Ad-hoc signed, not notarized. After installing from the dmg, clear
          quarantine once: `xattr -dr com.apple.quarantine /Applications/Omnigent.app`
          DESKTOP_NOTES
          (cd dist && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Idempotent for same-day reruns: refresh the notes when the release
      # already exists, then clobber-upload assets either way.
      - name: Publish dated prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --prerelease \
              --title "Personal staging $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber

      # Floating prerelease: the tag is (re)pointed FIRST so a partial state
      # (tag exists, release missing) can never pin the release to a stale
      # commit; the release is then edited in place (no delete/recreate, so
      # the stable releases/download/nightly-latest/<asset> URL never 404s).
      - name: Update nightly-latest
        env:
          # App tokens cannot update refs containing workflow-file changes;
          # prefer the workflows-scoped PAT, with GitHub token as fallback.
          GH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-latest" \
            -f sha="$STAGING_SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/nightly-latest" -f sha="$STAGING_SHA"
          if gh release view nightly-latest >/dev/null 2>&1; then
            gh release edit nightly-latest --prerelease \
              --title "Personal staging (latest — $TAG)" --notes-file notes.md
          else
            gh release create nightly-latest --prerelease \
              --title "Personal staging (latest — $TAG)" --notes-file notes.md
          fi
          gh release upload nightly-latest dist/* --clobber

      # Chain the image build. It is dispatch-only and always runs main's
      # trusted definition — nightly tags point at PR-merged code, so the
      # tag's own workflow copy must never run privileged. Probe for the
      # workflow file on main first: absent (not merged yet) is a warning,
      # while a failed dispatch of a present workflow fails the nightly.
      - name: Dispatch image build for this nightly
        run: |
          set -euo pipefail
          probe_rc=0
          probe_err="$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/personal-staging-images.yml?ref=main" \
            2>&1 >/dev/null)" || probe_rc=$?
          if [ "$probe_rc" -eq 0 ]; then
            gh workflow run personal-staging-images.yml --ref main -f ref="$TAG"
            echo "Dispatched personal-staging-images.yml (main) with ref=$TAG" >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$probe_err" | grep -q "(HTTP 404)"; then
            # Only a definite not-found means "not merged yet"; auth,
            # rate-limit, or network failures must fail the nightly loud.
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Image build NOT dispatched: personal-staging-images.yml is not on main yet." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "workflow probe failed (exit $probe_rc): $probe_err"
            exit 1
          fi

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — publish job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # A failed nightly leaves no promote candidate. Best-effort by contract: the
  # curl can only warn, never fail. composition-gate is deliberately not in
  # `needs`: an incomplete composition already sent its own alert, and its red
  # result must not send a second one (the skipped builds are not failures).
  alert-failure:
    needs: [test-composer, integrate, verify, android-build, android-sign, desktop-build, publish]
    if: (failure() || cancelled()) && github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Home Assistant
        env:
          HA_NOTIFY_HMAC: ${{ secrets.HA_NOTIFY_HMAC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$HA_NOTIFY_HMAC" ]; then
            echo "::warning::ha-notify skipped: HA_NOTIFY_HMAC secret is not set"
            exit 0
          fi
          body=$(python3 -c 'import json,sys; print(json.dumps({"message": sys.argv[1]}))' \
            "omnigent staging nightly FAILED — $RUN_URL")
          sig=$(printf '%s' "$body" | python3 -c 'import hashlib,hmac,os,sys; print(hmac.new(os.environ["HA_NOTIFY_HMAC"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          curl -fsS -m 15 -X POST https://hooks.bryanli.net/hooks/ha-notify \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-binary "$body" \
            || echo "::warning::ha-notify unreachable"
