# Nightly personal staging ring for the btli fork.
#
# Composes upstream main + every open btli PR (sequential merges, conflicts
# skipped and reported) onto fork branch `staging`, pins an immutable
# nightly-YYYYMMDD branch + tag and a PEP 440 vX.Y.Z.devYYYYMMDD tag, builds
# Android debug APK + unsigned release AAB from that commit, and publishes a
# prerelease (plus a floating `nightly-latest` for a stable download URL).
#
# The android build job executes third-party code (upstream + merged PR
# branches) and therefore runs secretless with credentials unpersisted;
# keystore secrets only ever appear in the separate sign job, which never
# checks out merged code.
name: Personal Staging Nightly

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-staging
  cancel-in-progress: false

jobs:
  # Keep fork main tracking upstream with a plain merge commit (no force). A
  # conflict fails THIS job with the paths in the summary — resolution is
  # manual — but the staging ring below still runs: it stacks from upstream
  # HEAD directly and never reads fork main.
  sync-main:
    # Fork-only, mirroring upstream's `if: github.repository == 'omnigent-ai/omnigent'` guards.
    if: github.repository == 'btli/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout fork main with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          git fetch upstream main
          if ! git merge --no-edit FETCH_HEAD; then
            {
              echo "## sync-main: merge conflict with upstream main"
              echo ""
              git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/'
              echo ""
              echo "Resolve manually; tonight's staging ring still ran from upstream HEAD."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin main

  integrate:
    # Runs even when sync-main failed on a conflict (the ring stacks from
    # upstream HEAD, not fork main) — but not when sync-main was skipped
    # (non-fork repo) or cancelled.
    needs: sync-main
    if: always() && github.repository == 'btli/omnigent' && needs.sync-main.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      staging_sha: ${{ steps.report.outputs.staging_sha }}
      tag: ${{ steps.report.outputs.tag }}
      date: ${{ steps.report.outputs.date }}
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      # Gate the night on the composer's own test suite (the repo's default
      # pytest testpaths never collect .github/scripts/**).
      - name: Test the staging composer
        run: uv run --frozen --extra dev python -m pytest .github/scripts/personal-staging/

      - name: Compose staging from upstream main + open btli PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          python3 .github/scripts/personal-staging/stage.py stage \
            --upstream-remote upstream --fork-remote origin \
            --report merge-report.json

      - name: Export report fields
        id: report
        run: |
          set -euo pipefail
          {
            echo "staging_sha=$(jq -r .staging_sha merge-report.json)"
            echo "tag=$(jq -r .tag merge-report.json)"
            echo "date=$(jq -r .date merge-report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload merge report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-report
          path: merge-report.json

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — integrate job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Secretless: this job executes third-party gradle/build code from the
  # merged PRs, so it gets no secrets and no persisted git credentials.
  android-build:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/android
    steps:
      - name: Checkout the staging commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.integrate.outputs.staging_sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: false

      # Datestamp as versionCode keeps nightly installs monotonically
      # upgradeable on-device (fits comfortably under Android's 2.1e9 cap).
      - name: Build debug APK and unsigned release AAB
        env:
          VERSION_CODE: ${{ needs.integrate.outputs.date }}
        run: |
          ./gradlew assembleDebug bundleRelease --no-daemon --console=plain \
            -PversionCode="$VERSION_CODE"

      # The release AAB must ship unsigned (no release keystore on this ring);
      # fail loud if a merged PR somehow wired a signing config in.
      - name: Verify release AAB is unsigned
        run: |
          set -euo pipefail
          out="$(jarsigner -verify app/build/outputs/bundle/release/app-release.aab)"
          echo "$out"
          echo "$out" | grep -qi "unsigned"

      - name: Stage build outputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/assets/omnigent-staging-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/assets/omnigent-staging-release-unsigned.aab"

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/assets/*

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — android-build job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  # Clean job for the keystore: only downloads the built artifact, never
  # checks out or executes merged code.
  android-sign:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - name: Download unsigned build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-unsigned
          path: assets

      - name: Decode shared debug keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No OMNIGENT_DEBUG_KEYSTORE_B64 secret; keeping the runner-ephemeral debug signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Re-sign with the shared keystore so nightly APKs upgrade in place
      # on-device (gradle's own debug keystore is runner-ephemeral).
      - name: Re-sign debug APK with shared keystore
        if: steps.keystore.outputs.signed == 'true'
        env:
          OMNIGENT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.OMNIGENT_DEBUG_KEYSTORE_PASSWORD }}
          OMNIGENT_DEBUG_KEY_ALIAS: ${{ secrets.OMNIGENT_DEBUG_KEY_ALIAS }}
          OMNIGENT_DEBUG_KEY_PASSWORD: ${{ secrets.OMNIGENT_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass env:OMNIGENT_DEBUG_KEYSTORE_PASSWORD \
            --ks-key-alias "$OMNIGENT_DEBUG_KEY_ALIAS" \
            --key-pass env:OMNIGENT_DEBUG_KEY_PASSWORD \
            assets/omnigent-staging-debug.apk
          "$apksigner" verify assets/omnigent-staging-debug.apk

      - name: Upload Android assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-assets
          path: assets/*

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — android-sign job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [integrate, android-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # for chaining the image-build workflow_dispatch
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.integrate.outputs.tag }}
      STAGING_SHA: ${{ needs.integrate.outputs.staging_sha }}
    steps:
      - name: Checkout (for the release script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download merge report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merge-report
          path: dist

      - name: Download Android assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-assets
          path: dist

      - name: Assemble notes and checksums
        env:
          SIGNED: ${{ needs.android-sign.outputs.signed }}
        run: |
          set -euo pipefail
          python3 .github/scripts/personal-staging/stage.py notes \
            --report dist/merge-report.json --signed "$SIGNED" > notes.md
          (cd dist && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Idempotent for same-day reruns: create the dated prerelease if
      # missing, then clobber-upload assets either way.
      - name: Publish dated prerelease
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease \
              --title "Personal staging $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber

      # Floating prerelease: updated in place (edit + tag repoint) so the
      # stable releases/download/nightly-latest/<asset> URL never 404s.
      - name: Update nightly-latest
        run: |
          set -euo pipefail
          if gh release view nightly-latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-latest" \
              -f sha="$STAGING_SHA" -F force=true
            gh release edit nightly-latest --prerelease \
              --title "Personal staging (latest — $TAG)" --notes-file notes.md
          else
            gh release create nightly-latest --prerelease --target "$STAGING_SHA" \
              --title "Personal staging (latest — $TAG)" --notes-file notes.md
          fi
          gh release upload nightly-latest dist/* --clobber

      # Chain the image build. It is dispatch-only and always runs main's
      # trusted definition — nightly tags point at PR-merged code, so the
      # tag's own workflow copy must never run privileged. The workflow may
      # not exist on main yet; warn instead of failing the nightly.
      - name: Dispatch image build for this nightly
        run: |
          set -euo pipefail
          if err="$(gh workflow run personal-staging-images.yml --ref main -f ref="$TAG" 2>&1)"; then
            echo "Dispatched personal-staging-images.yml (main) with ref=$TAG" >> "$GITHUB_STEP_SUMMARY"
          elif echo "$err" | grep -qiE "could not find|no workflow|404"; then
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Image build NOT dispatched: personal-staging-images.yml is not on main yet." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$err"
            exit 1
          fi

      - name: Report failure
        if: failure()
        run: echo "## Personal staging nightly — publish job FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"
